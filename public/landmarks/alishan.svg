<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of the Alishan forest railway crossing a sea of clouds at sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a31"/>
      <stop offset="0.38" stop-color="#3a3450"/>
      <stop offset="0.62" stop-color="#79515b"/>
      <stop offset="0.82" stop-color="#c87e63"/>
      <stop offset="1" stop-color="#f0bb82"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a60"/>
      <stop offset="1" stop-color="#2b3145"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3547"/>
      <stop offset="1" stop-color="#1a2331"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2cc"/>
      <stop offset="0.55" stop-color="#e3c5b3"/>
      <stop offset="1" stop-color="#b98e88"/>
    </linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8453c"/>
      <stop offset="0.6" stop-color="#8c2f2f"/>
      <stop offset="1" stop-color="#5d2026"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2ae" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ffc78d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffc78d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="806" cy="318" r="210" fill="url(#sunGlow)"/>
