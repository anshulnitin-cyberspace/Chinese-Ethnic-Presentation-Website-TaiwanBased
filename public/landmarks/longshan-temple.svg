<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of Longshan Temple glowing with lanterns and incense smoke at night">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080c1c"/>
      <stop offset="0.55" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#2a1f2b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d3a30"/>
      <stop offset="1" stop-color="#3b2022"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b2a"/>
      <stop offset="1" stop-color="#0c0b14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d489"/>
      <stop offset="1" stop-color="#b67c3d"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffb96a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff9d52" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff9d52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#ffe1a6"/>
      <stop offset="0.4" stop-color="#f2935a"/>
      <stop offset="0.82" stop-color="#cf3f36"/>
      <stop offset="1" stop-color="#82262a"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="smoke" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#night)"/>
