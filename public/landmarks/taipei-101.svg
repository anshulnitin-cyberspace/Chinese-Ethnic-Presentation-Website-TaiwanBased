    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f632f"/>
      <stop offset="0.3" stop-color="#f4cf8d"/>
      <stop offset="0.6" stop-color="#d6a35c"/>
      <stop offset="1" stop-color="#7b5227"/>
    </linearGradient>
    <linearGradient id="cityFar" x1="0" y1="0" x2="0" y2="1">
