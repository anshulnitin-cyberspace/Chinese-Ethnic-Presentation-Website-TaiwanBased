<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of Taipei 101 rising over the city at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070c1f"/>
      <stop offset="0.42" stop-color="#1b2140"/>
      <stop offset="0.68" stop-color="#4d3550"/>
      <stop offset="0.85" stop-color="#9a5a54"/>
      <stop offset="1" stop-color="#d08b62"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9bf" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffd79a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="towerHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7c67c" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#e8a76b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e8a76b" stop-opacity="0"/>
