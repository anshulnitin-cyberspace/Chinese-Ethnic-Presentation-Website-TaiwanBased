      <stop offset="0.28" stop-color="#4f8b85"/>
      <stop offset="0.55" stop-color="#6ea99a"/>
      <stop offset="0.82" stop-color="#2d5a5c"/>
      <stop offset="1" stop-color="#132c34"/>
