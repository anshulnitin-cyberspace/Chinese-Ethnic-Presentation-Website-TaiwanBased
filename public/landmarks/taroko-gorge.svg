  <path d="M300 0 L420 0 L520 430 L330 430 Z" fill="url(#shaft)" opacity="0.3"/>

  <g stroke="#20302f" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M520 160 C534 152 546 152 558 160"/>
    <path d="M552 142 C564 134 576 134 588 142"/>
    <path d="M690 200 C700 194 710 194 720 200"/>
