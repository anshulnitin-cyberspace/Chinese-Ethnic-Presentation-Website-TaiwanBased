<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of the marble cliffs and turquoise river of Taroko Gorge">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e6d8"/>
      <stop offset="0.45" stop-color="#96b8ae"/>
      <stop offset="1" stop-color="#5d8984"/>
    </linearGradient>
    <linearGradient id="cliffLeft" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#1b2a2b"/>
      <stop offset="0.4" stop-color="#435452"/>
      <stop offset="0.72" stop-color="#8b8d7d"/>
      <stop offset="1" stop-color="#c9c4ac"/>
    </linearGradient>
    <linearGradient id="cliffRight" x1="1" y1="0" x2="0" y2="0.2">
      <stop offset="0" stop-color="#182628"/>
      <stop offset="0.42" stop-color="#3b4d4b"/>
      <stop offset="0.75" stop-color="#7f8478"/>
      <stop offset="1" stop-color="#bdb9a3"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe0cf"/>
      <stop offset="0.4" stop-color="#4fb3ab"/>
      <stop offset="1" stop-color="#12666c"/>
    </linearGradient>
    <linearGradient id="farRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#789b91"/>
      <stop offset="1" stop-color="#42645f"/>
    </linearGradient>
    <radialGradient id="shaft" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="hazeSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

