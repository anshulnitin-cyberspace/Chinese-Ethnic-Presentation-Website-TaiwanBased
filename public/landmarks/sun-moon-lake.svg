<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of Sun Moon Lake at dawn with a pagoda and a small boat">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252e4c"/>
      <stop offset="0.38" stop-color="#5e587a"/>
      <stop offset="0.66" stop-color="#a97a86"/>
      <stop offset="0.85" stop-color="#e2a582"/>
      <stop offset="1" stop-color="#f4cfa2"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b59a9e"/>
      <stop offset="0.18" stop-color="#7d8f95"/>
      <stop offset="0.52" stop-color="#42696f"/>
      <stop offset="1" stop-color="#14333c"/>
    </linearGradient>
    <linearGradient id="farMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#646078"/>
      <stop offset="1" stop-color="#41485f"/>
    </linearGradient>
    <linearGradient id="midMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4358"/>
      <stop offset="1" stop-color="#232c3c"/>
    </linearGradient>
    <linearGradient id="nearMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22333a"/>
      <stop offset="1" stop-color="#101d24"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0ae" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#ffc98c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffc98c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="temple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b2f2e"/>
      <stop offset="1" stop-color="#2c1a1e"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="770" cy="318" r="190" fill="url(#sunGlow)"/>
